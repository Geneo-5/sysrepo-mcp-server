//
// NOTE: This configuration file is for documentation purposes only.
// sysrepo-mcp uses BUILD-TIME configuration via Kconfig (config.in).
// Runtime configuration is NOT supported in the current design.
//
// All configuration options are set at compile time through:
//   make config     (interactive menuconfig)
//   make defconfig  (default configuration)
//
// See config.in for available options and their defaults.

// ============================================================================
// This file shows the EQUIVALENT configuration that would be set via
// Kconfig options. It is NOT actually used by the server.
// ============================================================================

// Server Configuration
// --------------------
// Equivalent to CONFIG_SYSREPO_MCP_SERVER_LISTEN_* options
server_listen_address = "127.0.0.1";      // FastCGI listen address
server_listen_port = 8080;               // FastCGI listen port

// Sysrepo Configuration
// ---------------------
// Equivalent to CONFIG_SYSREPO_MCP_SERVER_USERNAME and TIMEOUT
sysrepo_username = "mcp";               // Username for sysrepo sessions
sysrepo_timeout = 5000;                 // Operation timeout in ms

// Note: sysrepo is used as a LIBRARY (linked at build time).
// No daemon socket is needed. Data is accessed directly from:
// /etc/sysrepo/data/

// Logging Configuration
// ---------------------
// Equivalent to CONFIG_SYSREPO_MCP_SERVER_SYSLOG and VERBOSE
logging_level = "info";                 // emerg|alert|crit|err|warning|notice|info|debug
logging_verbose = false;               // Enable verbose debugging

// Note: When compiled with elog support, logging is managed via
// command-line arguments to the elog library.
