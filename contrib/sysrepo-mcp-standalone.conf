#
# Standalone FastCGI listener. The matching systemd unit starts sysrepo-mcp
# directly; a FastCGI-capable reverse proxy connects to this Unix socket.

server:
{
	transport:
	{
		mode = "unix"; /* "unix" or "tcp"; "proxy" is the default */
		unix_socket_path = "/run/sysrepo-mcp/mcp.sock";

		/* For TCP, use a numeric IPv4 address and a port:
		 * mode = "tcp";
		 * tcp_host = "127.0.0.1";
		 * tcp_port = 8080;
		 */
	};

	auth:
	{
		method = "bearer";
		api_keys =
		(
			{ key = "replace-with-a-long-random-key"; user = "admin"; }
		);
	};

	log:
	{
		syslog_enabled = true;
		console = true;
		file = "/var/log/sysrepo-mcp/sysrepo-mcp.log";
	};
};
