#
# Reference lighttpd configuration for sysrepo-mcp.
#
#   lighttpd -D -f docker/lighttpd.conf
#
# The test suite does NOT use this file: tests/conftest.py generates its own
# configuration so each run gets a private socket, log and port. This one is
# the deployment example the documentation points at, and the thing to keep in
# sync with sphinx/architecture.rst.

# server.modules must be assigned before it can be appended to. Using `+=' on
# an undefined variable fails unless an earlier file already defined it, which
# is true of the Debian package layout but not of a standalone config.
server.modules = ( "mod_fastcgi" )

server.document-root = "/var/www/html"
server.bind          = "127.0.0.1"
server.port          = 80

server.errorlog      = "/var/log/lighttpd/error.log"
server.pid-file      = "/run/lighttpd.pid"

# Binding port 80 needs either root or CAP_NET_BIND_SERVICE. Docker sets
# net.ipv4.ip_unprivileged_port_start=0 by default, so an unprivileged process
# in a container can bind it; outside a container, drop privileges here.
#server.username  = "www-data"
#server.groupname = "www-data"

# Terminate TLS here in production. sysrepo-mcp never sees HTTPS, and the API
# key travels in a header, so an endpoint published over plain HTTP hands out
# credentials in the clear.
#server.modules += ( "mod_openssl" )
#$SERVER["socket"] == ":443" {
#    ssl.engine    = "enable"
#    ssl.pemfile   = "/etc/lighttpd/certs/sysrepo-mcp.pem"
#}

# The MCP endpoint.
#
# bin-path makes lighttpd spawn and supervise the server itself, handing the
# listening socket over on descriptor 0.
#
# max-procs MUST stay at 1. A session, its notification subscriptions and its
# notification queue live in the process that created them; with several
# processes, consecutive requests from one agent land in different ones and the
# session is not found. See sphinx/todo.rst, milestone 4.
fastcgi.server = (
    "/mcp" => (
        "sysrepo-mcp" => (
            "socket"          => "/run/sysrepo-mcp.sock",
            "bin-path"        => "/usr/local/bin/sysrepo-mcp",
            "check-local"     => "disable",
            "max-procs"       => 1,
            "bin-environment" => (
                "SYSREPO_REPOSITORY_PATH" => "/etc/sysrepo",
                "LD_LIBRARY_PATH"         => "/usr/local/lib"
            )
        )
    )
)
