# lighttpd configuration for sysrepo-mcp FastCGI proxy.
#
# Usage: lighttpd -f /etc/lighttpd/lighttpd.conf
#
# The binary path and socket path are configured at build time via
# Kconfig (config.in). This file uses the default paths.

server.port            = 8080
server.document-root   = "/var/www/localhost"
server.bind            = "127.0.0.1"

# FastCGI module
server.modules += ( "mod_fastcgi" )

# FastCGI mapping for sysrepo-mcp
fastcgi.server = (
    "/mcp" => (
        "sysrepo-mcp" => (
            "socket"     => "/tmp/sysrepo-mcp.sock",
            "check-local" => "disable",
            "bin-path"   => "/usr/local/bin/sysrepo-mcp",
            "max-procs"  => 4
        )
    )
)
