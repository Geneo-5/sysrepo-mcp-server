#
# Lighttpd front end for the sysrepo-mcp FastCGI application.
# Install as /etc/sysrepo-mcp/lighttpd.conf and adjust the paths and
# listen address for the host.

server.modules = ( "mod_fastcgi" )
server.document-root = "/var/www/html"
server.bind = "127.0.0.1"
server.port = 8080

# TLS should terminate at a trusted reverse proxy in front of this local
# listener. Do not expose plain HTTP on a public interface: API keys are sent
# in request headers.
fastcgi.server = (
    "/mcp" => (
        "sysrepo-mcp" => (
            "socket"          => "/run/sysrepo-mcp/mcp.sock",
            "bin-path"        => "/usr/local/bin/sysrepo-mcp --config /etc/sysrepo-mcp/sysrepo-mcp.conf",
            "check-local"     => "disable",
            "max-procs"       => 1,
            "bin-environment" => (
                "LD_LIBRARY_PATH" => "/usr/local/lib"
            )
        )
    )
)
