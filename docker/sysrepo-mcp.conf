# ==============================================================================
# sysrepo-mcp — runtime configuration for tests
#
# This file is a libconfig file (see libconfig(5)).  It replaces the Kconfig
# options in config.in and the YANG subtree yang/sysrepo-mcp:api-key with
# equivalent settings.
#
# Build-time options (transport mode, socket path, log file) are not testable
# from here; only the tunables that affect behaviour at runtime are listed.
# ==============================================================================

server {

    session {
	max_sessions     = 64		/* SYSREPO_MCP_SERVER_MAX_SESSIONS */
	session_ttl      = 1800		/* SYSREPO_MCP_SERVER_SESSION_TTL (seconds) */
	notif_queue_size = 256		/* SYSREPO_MCP_SERVER_NOTIF_QUEUE_SIZE */
	max_tree_depth   = 32		/* SYSREPO_MCP_SERVER_MAX_TREE_DEPTH */
    }

    transport {
	mode = "unix"			/* "unix" or "tcp" */
	unix_socket_path = "/var/run/sysrepo-mcp.sock"
	tcp_host = "127.0.0.1"
	tcp_port = 8080
    }

    auth {
	method = "bearer"		/* "bearer" or "cookie" */
	cookie_name = "mcp_session"

	api_keys = [
		{ key = "test-admin-key-0001"; user = "admin"; },
		{ key = "test-admin-key-0002"; user = "operator"; },
		{ key = "test-ro-key-0001";  user = "viewer"; },
	];
    }

    acl {
	enabled = true
	enable_nacm = true
	enable_module_filter = true
	enable_operation_filter = false
	enable_write_protection = false
	/* allowed_modules = [ "oven" ]; */
    }

    log {
	syslog_enabled = true
	level = 6			/* 0=emerg … 7=debug */
	verbose = false
	console = true
	file = "/var/log/sysrepo-mcp.log"
    }
}
