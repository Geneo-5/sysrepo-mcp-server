//
// Exemple de fichier de configuration pour sysrepo-mcp-server
// Syntaxe : libconfig (inspiré de ini mais avec types forts)

server {
    // Adresse d'écoute du serveur MCP
    host "0.0.0.0";
    port 8000;

    // Type de transport (unix ou tcp)
    transport "tcp";

    // Chemin socket unix (si transport = "unix")
    // socket_path "/tmp/sysrepo-mcp.sock";

    // Connexion à sysrepo
    sysrepo {
        // Chemin vers le socket sysrepo
        socket_path "/var/run/sysrepo/sysrepod.sock";

        // Authentification sysrepo
        username "sysrepo-mcp";
        password "";  // laissé vide, utilise l'authentification système

        // Timeout connexion (ms)
        connection_timeout 5000;
    };

    // Journalisation
    logging {
        // Niveau : emerg, alert, crit, err, warning, notice, info, debug
        level "info";

        // Utiliser syslog ou stderr
        use_syslog yes;

        // Fichier de log (si use_syslog = no)
        logfile "/var/log/sysrepo-mcp-server.log";
    };

    // Options de l'agent IA
    agent {
        // Authentification de l'agent
        api_key "";  // clé API vide par défaut

        // Nom de l'agent (identification)
        name "openhands-agent";

        // Permissions (quels modules YANG l'agent peut modifier)
        allowed_modules = [ "ietf-interfaces", "ietf-routing" ];
    };
};
